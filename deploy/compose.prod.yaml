# Production Compose: immutable digests, no bind-mounted source, bounded
# logging, memory/CPU limits, 30s stop grace for clean WS drain (1012).
# Images are set by the deploy workflow via IMAGE_API_DIGEST/IMAGE_WEB_DIGEST.
services:
  api:
    image: ${ECR_REGISTRY}/quizforge-api@${IMAGE_API_DIGEST:?IMAGE_API_DIGEST is required}
    env_file: /opt/quizforge/.env
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1400M }
        reservations: { memory: 512M }
    logging:
      driver: awslogs
      options:
        awslogs-group: ${CW_LOG_GROUP_API:-/quizforge-staging/api}
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        tag: quizforge/api/{{.Name}}
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test: ["CMD", "/quizforge", "healthcheck", "--url=http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [app]

  web:
    image: ${ECR_REGISTRY}/quizforge-web@${IMAGE_WEB_DIGEST:?IMAGE_WEB_DIGEST is required}
    env_file: /opt/quizforge/.env # Caddy reads {$APP_DOMAIN} from its own environment (S5-21)
    depends_on:
      api: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging:
      driver: awslogs
      options:
        awslogs-group: ${CW_LOG_GROUP_WEB:-/quizforge-staging/web}
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        tag: quizforge/web/{{.Name}}
        mode: non-blocking
        max-buffer-size: 4m
    networks: [app]

networks:
  app: {}
volumes:
  caddy_data: {}
  caddy_config: {}
