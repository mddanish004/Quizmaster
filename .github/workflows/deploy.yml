name: deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Migrate production database (Neon, direct URL)
        # golang-migrate wants a postgres:// scheme; Neon issues
        # postgresql://, so normalize before invoking.
        run: |
          DB_URL="${MIGRATIONS_DATABASE_URL/postgresql:/postgres:}"
          docker run --rm \
            -v "$PWD/database/migrations:/migrations:ro" \
            migrate/migrate:v4.18.3 \
            -path /migrations -database "$DB_URL" up
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Smoke check (readiness + version)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$RENDER_APP_URL/health/ready" >/dev/null 2>&1; then break; fi
            echo "waiting for ready ($i/30)"; sleep 20
          done
          curl -fsS "$RENDER_APP_URL/health/ready"
          curl -fsS "$RENDER_APP_URL/version"
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
