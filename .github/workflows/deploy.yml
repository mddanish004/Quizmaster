name: deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ap-southeast-1
jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd0a58b666b2d8404de6d00460ddf3307d5b4 # v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4e37000b34941d5a95c8 # v2
        id: ecr
      - uses: docker/setup-buildx-action@b5ca51431880c0f104461383c307baa6546bfb # v3
      - name: Build + push API (ARM64)
        id: api
        uses: docker/build-push-action@48aba3b46d1e8a4aadf06b3291a15d9e16ca6 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-api:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - name: Build + push web (ARM64)
        id: web
        uses: docker/build-push-action@48aba3b46d1e8a4aadf06b3291a15d9e16ca6 # v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-web:${{ github.sha }}
      - name: Build + push migrate (ARM64)
        id: migrate
        uses: docker/build-push-action@48aba3b46d1e8a4aadf06b3291a15d9e16ca6 # v6
        with:
          context: .
          file: backend/Dockerfile.migrate
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-migrate:${{ github.sha }}
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/quizforge-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy image scan (web, migrate)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/quizforge-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
  deploy-prod:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@e3dd0a58b666b2d8404de6d00460ddf3307d5b4 # v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Deploy via SSM (migrate + switch + smoke)
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.PROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands=["cd /opt/quizforge && ECR_REGISTRY=${{ secrets.ECR_REGISTRY }} ./deploy/scripts/deploy.sh ${{ needs.build-push.outputs.api_digest }} ${{ needs.build-push.outputs.web_digest }}"] \
            --output text
