name: deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ap-southeast-1
jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (verified)
      - name: Debug OIDC claims (temporary, S5-7)
        run: |
          T=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          python3 -c "import base64,json,sys; p=sys.argv[1].split('.')[1]; print(json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4))))" "$T" | python3 -m json.tool | grep -E '"(iss|sub|aud|repository|ref|environment)"'
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4 (verified)
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-skip-session-tagging: true # trust allows AssumeRole only; see S5-7
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2 (verified)
        id: ecr
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (verified)
      - name: Build + push API (ARM64)
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (verified)
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-api:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - name: Build + push web (ARM64)
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (verified)
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-web:${{ github.sha }}
      - name: Build + push migrate (ARM64)
        id: migrate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (verified)
        with:
          context: .
          file: backend/Dockerfile.migrate
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizforge-migrate:${{ github.sha }}
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/quizforge-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Trivy image scan (web, migrate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/quizforge-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
  deploy-prod:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4 (verified)
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-skip-session-tagging: true # trust allows AssumeRole only; see S5-7
      - name: Deploy via SSM (migrate + switch + smoke)
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.PROD_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands=["cd /opt/quizforge && ECR_REGISTRY=${{ secrets.ECR_REGISTRY }} ./deploy/scripts/deploy.sh ${{ needs.build-push.outputs.api_digest }} ${{ needs.build-push.outputs.web_digest }}"] \
            --output text
