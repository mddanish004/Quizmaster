# Local development: one service builds the production image (API + SPA).
# The UI is served from the image; `vite dev` (npm run dev) is only needed
# for hot-reload frontend work, proxying /api + /ws to this service.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/quizforge", "healthcheck", "--url=http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
